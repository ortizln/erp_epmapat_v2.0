spring:
  application:
    name: msvc-sri
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ErpEpmapaT}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:12345}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

debug: false
xml:
  storage:
    path: /path/to/your/xml/storage
app:
  reports:
    path: /home/epmapaadmin/reportsEpmapat
  backend:
    base-url: ${ERP_BACKEND_BASE_URL:http://192.168.0.165:9080}
  email-ms:
    base-url: http://msvc-emails:9099
  mail:
    from: facturacion@epmapatulcan.gob.ec
    username: facturacion
    display-name: EPMAPA-T
    reply-to: facturacion@epmapatulcan.gob.ec
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-requests-per-minute: ${RATE_LIMIT_PER_MINUTE:60}
    max-requests-per-hour: ${RATE_LIMIT_PER_HOUR:1000}
  security:
    headers:
      enabled: ${SECURITY_HEADERS_ENABLED:true}
      content-type-options: true
      xss-protection: true
      frame-options: true
      hsts: true
  apikey:
    enabled: ${API_KEY_ENABLED:false}
    header: ${API_KEY_HEADER:X-API-Key}
    value: ${API_KEY_VALUE:}
    whitelisted-paths: /api/v1/erp/ping,/swagger-ui/**,/v3/api-docs/**,/actuator/health
interes:
  tarea:
    cron: 0 */1 * * * *
sri:
  scheduler:
    envio-facturas:
      cron: ${SRI_SCHEDULER_ENVIO_FACTURAS_CRON:0 */1 * * * *}
    recuperacion-xml:
      cron: ${SRI_SCHEDULER_RECUPERACION_XML_CRON:30 */3 * * * *}
    recuperar-devueltas:
      cron: ${SRI_SCHEDULER_RECUPERAR_DEVUELTAS_CRON:0 */5 * * * *}
  ambiente: 2
  polling:
    attempts: 40
    initialSleepMs: 2000
    maxSleepMs: 8000
    backoffFactor: 1.5
    stopOnNoAutorizado: true
  batch:
    enviar-sri: ${SRI_BATCH_ENVIAR_SRI:0 */2 * * * *}
    consultar-autorizacion: ${SRI_BATCH_CONSULTAR_AUTH:0 */3 * * * *}
    reintentar-fallidos: ${SRI_BATCH_REINTENTAR:0 */5 * * * *}
    enviar-correo: ${SRI_BATCH_CORREO:0 */4 * * * *}
  wsdl:
    local:
      recepcion: wsdl/RecepcionComprobantesOffline.wsdl
      autorizacion: wsdl/AutorizacionComprobantesOffline.wsdl
  endpoint:
    recepcion:
      pruebas: https://celcer.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline
      produccion: https://cel.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline
    autorizacion:
      pruebas: https://celcer.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline
      produccion: https://cel.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}

net:
  sf:
    jasperreports:
      awt:
        ignore:
          missing:
            font=true:

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
