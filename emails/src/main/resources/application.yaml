spring:
  application:
    name: msvc-emails
  profiles:
    active: dev
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/2026-10-29_email_retry.sql,classpath:sql/2026-10-30_correo_intentos.sql
      continue-on-error: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
management:
  health:
    mail:
      enabled: false
mailms:
  from: "EPMAPA-T <no-reply@epmapatulcan.gob.ec>"
  attachment-storage:
    base-path: "/data/attachments"
  outbox:
    batch-size: 20
    max-attempts: 5
    retry-delays-seconds: ${MAIL_RETRY_DELAYS_SECONDS:60,300,900,3600}
    scheduler-fixed-delay-ms: 15000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

