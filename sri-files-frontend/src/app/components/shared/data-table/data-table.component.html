<div class="data-table-wrapper">
  <!-- Loading overlay -->
  <div class="table-loading" *ngIf="loading">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <!-- Table -->
  <div class="table-responsive">
    <table class="data-table" [class.table-striped]="striped">
      <thead>
        <tr>
          <th *ngFor="let col of columns"
              [class.sortable]="col.sortable"
              [class.sort-active]="sortKey === col.key"
              [class.sort-asc]="sortKey === col.key && sortDirection === 'asc'"
              [class.sort-desc]="sortKey === col.key && sortDirection === 'desc'"
              [style.width]="col.width"
              [style.text-align]="col.align || 'left'"
              (click)="onSort(col)">
            {{ col.label }}
            <i class="bi sort-icon" *ngIf="col.sortable"
               [ngClass]="getSortIcon(col)"></i>
          </th>
          <th *ngIf="actions.length" style="width: 120px; text-align: center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of data">
          <td *ngFor="let col of columns"
              [style.text-align]="col.align || 'left'">

            <!-- Text -->
            <span *ngIf="col.type === 'text' || !col.type">
              {{ getCellValue(row, col) }}
            </span>

            <!-- Code -->
            <code *ngIf="col.type === 'code'" class="cell-code">
              {{ getCellValue(row, col) }}
            </code>

            <!-- Badge -->
            <span *ngIf="col.type === 'badge'" class="badge-status"
                  [ngClass]="col.badgeClass ? col.badgeClass(row[col.key], row) : 'badge-secondary'">
              {{ getCellValue(row, col) }}
            </span>

            <!-- Icon badge -->
            <span *ngIf="col.type === 'icon'" class="badge-status"
                  [ngClass]="col.badgeClass ? col.badgeClass(row[col.key], row) : 'badge-secondary'">
              <i class="bi" [ngClass]="col.iconClass ? col.iconClass(row[col.key], row) : ''"></i>
              {{ getCellValue(row, col) }}
            </span>

            <!-- Date -->
            <span *ngIf="col.type === 'date'" class="cell-date">
              {{ getCellValue(row, col) }}
            </span>
          </td>

          <!-- Actions -->
          <td *ngIf="actions.length" style="text-align: center">
            <div class="actions-cell">
              <button *ngFor="let action of actions"
                      class="btn btn-icon"
                      [ngClass]="action.class || 'btn-outline-secondary'"
                      [title]="action.label"
                      [disabled]="action.disabled ? action.disabled(row) : false"
                      (click)="action.click(row)">
                <i class="bi" [ngClass]="action.icon"></i>
              </button>
            </div>
          </td>
        </tr>

        <!-- Empty state -->
        <tr *ngIf="data.length === 0 && !loading">
          <td [attr.colspan]="columns.length + (actions.length ? 1 : 0)">
            <div class="table-empty">
              <i class="bi" [ngClass]="emptyIcon"></i>
              <p>{{ emptyMessage }}</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination-wrapper" *ngIf="totalItems > 0">
    <div class="pagination-info">
      Mostrando <strong>{{ getFrom() }}–{{ getTo() }}</strong> de
      <strong>{{ totalItems }}</strong> registros
    </div>

    <div class="pagination-controls">
      <button class="page-btn" [disabled]="currentPage === 0" (click)="onPageChange(0)" title="Primera">
        <i class="bi bi-chevrons-left"></i>
      </button>
      <button class="page-btn" [disabled]="currentPage === 0" (click)="onPageChange(currentPage - 1)" title="Anterior">
        <i class="bi bi-chevron-left"></i>
      </button>

      <ng-container *ngFor="let p of visiblePages">
        <button *ngIf="p === 'ellipsis'" class="page-btn page-ellipsis" disabled>
          <i class="bi bi-three-dots"></i>
        </button>
        <button *ngIf="p !== 'ellipsis'" class="page-btn"
                [class.active]="p === currentPage"
                (click)="onPageChange(p)">
          {{ p + 1 }}
        </button>
      </ng-container>

      <button class="page-btn" [disabled]="currentPage >= totalPages - 1" (click)="onPageChange(currentPage + 1)" title="Siguiente">
        <i class="bi bi-chevron-right"></i>
      </button>
      <button class="page-btn" [disabled]="currentPage >= totalPages - 1" (click)="onPageChange(totalPages - 1)" title="Última">
        <i class="bi bi-chevrons-right"></i>
      </button>

      <select class="page-size-select" [value]="pageSize" (change)="onPageSizeChange($event)">
        <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }} / pág</option>
      </select>
    </div>
  </div>
</div>
