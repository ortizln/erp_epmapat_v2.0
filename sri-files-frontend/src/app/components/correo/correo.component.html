<div class="page-header">
  <h4><i class="bi bi-envelope-at"></i> Correo Electrónico</h4>
</div>

<div class="row g-4">
  <div class="col-lg-6">
    <div class="card h-100">
      <div class="card-header">
        <i class="bi bi-heart-pulse" style="color: var(--danger)"></i> Estado SMTP
      </div>
      <div class="card-body">
        <button class="btn btn-outline-primary" (click)="verificarSmtp()" [disabled]="verificando">
          <span *ngIf="verificando" class="spinner-border spinner-border-sm"></span>
          <i *ngIf="!verificando" class="bi bi-arrow-clockwise"></i>
          {{ verificando ? 'Verificando...' : 'Verificar Conectividad' }}
        </button>
        <div *ngIf="smtpStatus" class="mt-4">
          <div class="d-flex align-items-center gap-2 mb-3 p-3 rounded"
            [ngClass]="smtpStatus.smtp === 'UP' ? 'bg-success bg-opacity-10' : 'bg-danger bg-opacity-10'">
            <span class="dot" [class.dot-up]="smtpStatus.smtp === 'UP'" [class.dot-down]="smtpStatus.smtp !== 'UP'"></span>
            <span class="fw-semibold">SMTP: {{ smtpStatus.smtp }}</span>
          </div>
          <div class="text-muted">
            <i class="bi bi-clock"></i> {{ smtpStatus.time }}
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="card h-100">
      <div class="card-header">
        <i class="bi bi-send" style="color: var(--primary)"></i> Enviar Correo de Prueba
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Correo destino</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" [(ngModel)]="correoDestino"
              placeholder="admin@epmapatulcan.gob.ec">
          </div>
        </div>
        <button class="btn btn-primary" (click)="enviarTest()" [disabled]="enviando || !correoDestino.trim()">
          <span *ngIf="enviando" class="spinner-border spinner-border-sm"></span>
          <i *ngIf="!enviando" class="bi bi-send"></i>
          {{ enviando ? 'Enviando...' : 'Enviar Prueba' }}
        </button>
        <div *ngIf="resultado" class="alert mt-3" [ngClass]="resultado.exito ? 'alert-success' : 'alert-danger'">
          <i class="bi" [ngClass]="resultado.exito ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'"></i>
          {{ resultado.mensaje }}
        </div>
      </div>
    </div>
  </div>
</div>
